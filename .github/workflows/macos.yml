name: macOS validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
      - name: Test application and packaging safeguards
        run: |
          swift test --arch arm64
          python3 -m unittest discover -s scripts/tests -v
      - name: Build sandboxed developer application
        run: python3 scripts/release.py local
      - name: Validate personal application with updater
        run: python3 scripts/release.py personal
      - name: Validate both distribution archives without credentials
        run: |
          python3 scripts/release.py archive --channel direct --unsigned
          python3 scripts/release.py archive --channel app-store --unsigned
      - name: Check local-only disk image packaging
        run: |
          python3 scripts/release.py dmg --app "dist/DerivedData/Build/Products/Debug/Focus Desk.app" --local-only
          hdiutil verify dist/installers/*-local-test-only.dmg
